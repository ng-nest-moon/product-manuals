<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机会雷达</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root {
        --board: #0d1b2a; --board-dark: #070e17;
        --chalk: #e0e7ff; --chalk-dim: rgba(224,231,255,0.55);
        --chalk-dimmer: rgba(224,231,255,0.18); --chalk-translucent: rgba(224,231,255,0.06);
        --accent-cyan: #22d3ee; --accent-emerald: #34d399; --accent-amber: #fbbf24;
        --accent-rose: #fb7185; --accent-violet: #a78bfa; --accent-sky: #38bdf8;
        --scanline: rgba(0,0,0,0.06); --font-display: "Noto Sans SC","PingFang SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-mono: "IBM Plex Mono","SFMono-Regular", Menlo, Consolas, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
      }
      html,body{height:100%;background:#050b14;font-family:var(--font-mono);color:var(--chalk);overflow-x:hidden}
      .screen-frame{position:relative;min-height:100vh;padding:28px 20px 20px;background:#111;border-radius:20px;box-shadow:inset 0 0 40px rgba(0,0,0,0.8),0 8px 40px rgba(0,0,0,0.6);max-width:1360px;margin:0 auto}
      .screen-frame::before{content:"";position:absolute;inset:0;border-radius:20px;background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scanline) 2px,var(--scanline) 4px);pointer-events:none;z-index:100}
      .crt-curve{position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,0.35) 100%);pointer-events:none;z-index:99}
      .power-led{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--chalk-dim);letter-spacing:1.5px;z-index:101}
      .power-led span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:led-pulse 2s ease-in-out infinite}
      @keyframes led-pulse{0%,100%{opacity:1;box-shadow:0 0 6px #4ade80}50%{opacity:0.5;box-shadow:0 0 2px #4ade80}}
      .chalkboard{position:relative;background:var(--board);border:3px solid #1a3050;border-radius:4px;padding:32px 28px 28px;box-shadow:inset 0 0 60px rgba(0,0,0,0.5),0 4px 0 #0c1a30;min-height:calc(100vh - 80px)}
      .chalkboard::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(224,231,255,0.02) 0,transparent 60%),radial-gradient(circle at 80% 70%,rgba(224,231,255,0.015) 0,transparent 50%),radial-gradient(circle at 50% 50%,rgba(224,231,255,0.01) 0,transparent 70%);pointer-events:none;border-radius:2px}
      .header{text-align:center;margin-bottom:24px;position:relative;z-index:1}
      .header h1{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--accent-cyan);text-shadow:0 0 8px rgba(34,211,238,0.3);letter-spacing:2px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:10px}
      .header .subtitle{font-size:14px;color:var(--chalk-dim);letter-spacing:0.5px}
      .header .subtitle em{font-style:normal;color:var(--accent-emerald)}
      .layout-main{display:flex;gap:20px;position:relative;z-index:1}
      .layers-column{flex:1;min-width:0}
      .side-column{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
      .svg-connectors{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
      .layer{position:relative;background:var(--chalk-translucent);border:1.5px solid var(--chalk-dimmer);border-radius:6px;padding:12px 14px 14px;margin-bottom:0;cursor:pointer;transition:border-color 0.3s,background 0.3s;opacity:0;transform:translateY(20px)}
      .layer:hover{border-color:var(--accent-cyan);background:rgba(34,211,238,0.06)}
      .layer-label{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--chalk-dim);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
      .layer-label .badge{font-size:10px;font-weight:600;background:var(--chalk-dimmer);color:var(--board);padding:1px 7px;border-radius:3px;letter-spacing:0}
      .layer-modules{display:flex;flex-wrap:wrap;gap:6px}
      .module{background:rgba(224,231,255,0.06);border:1px solid var(--chalk-dimmer);border-radius:4px;padding:5px 10px;font-size:12px;line-height:1.5;color:var(--chalk);transition:all 0.25s;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
      .module:hover{background:rgba(224,231,255,0.12);border-color:var(--chalk);transform:translateY(-1px)}
      svg.icon,.module svg,.side-module svg,.dot svg{width:16px;height:16px;flex-shrink:0}
      .module svg{width:15px;height:15px}
      .dot svg{width:14px;height:14px}
      .layer-label>svg:first-child{width:18px;height:18px;flex-shrink:0}
      .header h1 svg{width:28px;height:28px;flex-shrink:0}
      .module .tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;margin-left:4px;opacity:0.8}
      .tag-scan{background:var(--accent-cyan);color:var(--board)}
      .tag-out{background:var(--accent-emerald);color:var(--board)}
      .tag-warn{background:var(--accent-amber);color:var(--board)}
      .tag-data{background:var(--accent-violet);color:var(--board)}
      .layer[data-layer="config"]{border-left:3px solid var(--accent-sky)}
      .layer[data-layer="engine"]{border-left:3px solid var(--accent-cyan)}
      .layer[data-layer="output"]{border-left:3px solid var(--accent-emerald)}
      .arrow-down{display:flex;align-items:center;justify-content:center;height:28px;position:relative;opacity:0}
      .arrow-down svg{width:100%;height:28px}
      .arrow-label{position:absolute;font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--chalk-dim);letter-spacing:0.5px;background:var(--board);padding:0 8px;text-align:center;white-space:nowrap}
      .side-module{background:var(--chalk-translucent);border:1.5px solid var(--chalk-dimmer);border-left:3px solid var(--accent-violet);border-radius:6px;padding:10px 12px;cursor:pointer;opacity:0;transform:translateX(15px);transition:border-color 0.3s,background 0.3s}
      .side-module:hover{border-color:var(--accent-violet);background:rgba(167,139,250,0.08)}
      .side-module .layer-label{margin-bottom:4px}
      .side-module .desc{font-size:12px;color:var(--chalk-dim);line-height:1.5}
      .user-flow{margin-top:22px;padding:14px 16px;background:var(--chalk-translucent);border:1.5px solid var(--chalk-dimmer);border-radius:6px;position:relative;z-index:1;opacity:0}
      .user-flow-header{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--accent-cyan);letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
      .user-flow-steps{display:flex;align-items:center;flex-wrap:wrap;gap:0}
      .flow-step{display:flex;align-items:center;gap:0;opacity:0}
      .flow-step .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--chalk-dimmer);background:var(--board);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;flex-shrink:0;transition:all 0.3s}
      .flow-step .dot.active{border-color:var(--accent-cyan);background:rgba(34,211,238,0.12);box-shadow:0 0 10px rgba(34,211,238,0.2)}
      .flow-step .label{font-size:12px;color:var(--chalk-dim);white-space:nowrap;margin:0 8px 0 6px;line-height:1}
      .flow-step .conn{width:24px;height:2px;background:var(--chalk-dimmer);position:relative;flex-shrink:0}
      .flow-step .conn::after{content:"▸";position:absolute;right:-4px;top:-6px;font-size:10px;color:var(--chalk-dimmer)}
      .flow-step:last-child .conn{display:none}
      .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
      .detail-overlay.open{display:flex}
      .detail-card{background:var(--board-dark);border:2px solid var(--chalk-dimmer);border-radius:8px;padding:24px 28px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.6);will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
      .detail-card h2{margin-top: 0;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--accent-cyan);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--chalk-dimmer);display:flex;align-items:center;gap:8px}
      .detail-card h2 svg{width:22px;height:22px;flex-shrink:0}
      .detail-card h3{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--chalk-dim);margin:14px 0 6px}
      .detail-card ul{list-style:none;padding:0}
      .detail-card li{font-size:13px;color:var(--chalk);padding:5px 0 5px 14px;border-left:2px solid var(--chalk-dimmer);margin-bottom:6px;line-height:1.6}
      .detail-card li .hl{color:var(--accent-cyan);display:inline-flex;align-items:center;gap:4px}
      .detail-card li .hl-warn{color:var(--accent-amber)}
      .detail-card .close-btn{position:absolute;top:14px;right:16px;font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--chalk-dimmer);background:none;border:1px solid var(--chalk-dimmer);border-radius:4px;padding:4px 12px;cursor:pointer;transition:all 0.2s}
      .detail-card .close-btn:hover{color:var(--accent-rose);border-color:var(--accent-rose)}
      @media (max-width:860px){
        .layout-main{flex-direction:column}
        .side-column{width:100%;flex-direction:row;flex-wrap:wrap}
        .side-module{flex:1;min-width:160px}
        .header h1{font-size:20px}
        .screen-frame{padding:24px 12px 12px}
        .chalkboard{padding:20px 14px 16px}
        .layer-modules{gap:4px}
        .module{font-size:11px;padding:4px 8px}
        .flow-step .label{font-size:10px}
        .flow-step .dot{width:24px;height:24px;font-size:11px}
      }
      @media (max-width:480px){
        .header h1{font-size:16px;letter-spacing:1px}
        .module{font-size:10px;padding:3px 6px;white-space:normal}
        .layer{padding:8px 8px 10px}
        .layer-label{font-size:10px}
      }
      .chalk-glow{position:absolute;pointer-events:none;width:4px;height:4px;border-radius:50%;background:rgba(224,231,255,0.15);filter:blur(6px)}
      ::-webkit-scrollbar{width:4px}
      ::-webkit-scrollbar-track{background:var(--board-dark)}
      ::-webkit-scrollbar-thumb{background:var(--chalk-dimmer);border-radius:2px}
      .arrow-path{stroke-dasharray:200;stroke-dashoffset:200}
    .layer-label svg{width:16px;height:16px;flex-shrink:0}
</style>
  </head>
  <body>
    <div class="screen-frame">
      <div class="crt-curve"></div>
      <div class="power-led"><span></span> SYSTEM · ONLINE</div>
      <div class="chalkboard" id="chalkboard">
        <div class="header" id="header">
          <h1>
            <svg class="icon" viewBox="0 0 20 20"><use href="#icon-radar" /></svg>
            机会雷达
          </h1>
          <div class="subtitle">拓宽职业信息面 · <em>机会不是等来的，是扫出来的</em></div>
        </div>
        <svg class="svg-connectors" id="connectorSvg" preserveAspectRatio="none">
          <defs>
            <marker id="arrowHead" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--chalk-dimmer)" opacity=".6"/></marker>
            <marker id="arrowHeadFlow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--accent-cyan)"/></marker>
            <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <symbol id="icon-radar" viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="8" stroke="currentColor" fill="none" stroke-width="1.2"/>
              <circle cx="10" cy="10" r="5" stroke="currentColor" fill="none" stroke-width=".8" opacity=".4"/>
              <circle cx="10" cy="10" r="2" stroke="currentColor" fill="none" stroke-width=".8" opacity=".4"/>
              <path d="M10 10L5 5M10 10l6-2M10 10l-2 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <circle cx="5" cy="5" r="1.2" fill="var(--accent-cyan)" opacity=".8"/>
              <circle cx="16" cy="8" r="1" fill="var(--accent-amber)" opacity=".8"/>
              <circle cx="8" cy="16" r="1.2" fill="var(--accent-emerald)" opacity=".8"/>
            </symbol>
            <symbol id="icon-config" viewBox="0 0 20 20">
              <rect x="3" y="3" width="6" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="11" y="3" width="6" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="3" y="11" width="6" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="11" y="11" width="6" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <path d="M6 3V1M6 17v2M14 3V1M14 17v2M3 6H1M17 6h2M3 14H1M17 14h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-scan" viewBox="0 0 20 20">
              <path d="M3 10h14M10 3v14M6 6l2 2M14 6l-2 2M6 14l2-2M14 14l-2-2" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="10" cy="10" r="3" stroke="currentColor" fill="none" stroke-width="1.5"/>
            </symbol>
            <symbol id="icon-dashboard" viewBox="0 0 20 20">
              <rect x="2" y="3" width="7" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="11" y="3" width="7" height="3" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="11" y="8" width="7" height="5" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <rect x="2" y="11" width="7" height="6" rx=".5" stroke="currentColor" fill="none" stroke-width="1.5"/>
            </symbol>
            <symbol id="icon-trend" viewBox="0 0 20 20">
              <path d="M3 17l4-6 3 2 4-5 3 8" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="7" cy="11" r="1" fill="var(--accent-rose)"/>
              <circle cx="14" cy="6" r="1" fill="var(--accent-emerald)"/>
            </symbol>
            <symbol id="icon-network" viewBox="0 0 20 20">
              <circle cx="10" cy="5" r="2" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <circle cx="5" cy="15" r="2" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <circle cx="15" cy="15" r="2" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <path d="M8 7L7 13M12 7l1 6M5 15h10" stroke="currentColor" fill="none" stroke-width="1.2" opacity=".6"/>
            </symbol>
            <symbol id="icon-bookmark" viewBox="0 0 20 20">
              <path d="M5 3h10v14l-5-4-5 4V3z" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round"/>
            </symbol>
            <symbol id="icon-map" viewBox="0 0 20 20">
              <path d="M3 5l5-2 4 3 5-2v11l-5 2-4-3-5 2V5z" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round"/>
            </symbol>
            <symbol id="icon-target" viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="7" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="3" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <path d="M10 1v3m0 12v3M1 10h3m12 0h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-doc" viewBox="0 0 20 20">
              <path d="M5 3h6l4 4v10H5z" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M11 3v4h4M7 9h6M7 12h6M7 15h4" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-coin" viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="7" stroke="currentColor" fill="none" stroke-width="1.5"/>
              <path d="M10 6v8M7 8.5c0-1 1.5-2 3-2s3 1 3 2-1.5 2-3 2-3 1-3 2 1.5 2 3 2 3-1 3-2" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-refresh" viewBox="0 0 20 20">
              <path d="M14.5 6C12.5 4 9.5 3.5 7 5 4.5 6.5 3.5 9.5 3.5 12" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.5 9.5l4-4 2 3" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.5 14c2 2.5 5.5 3 8 1.5C16 14 17 11 16.5 8" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.5 11l-4 4-2-3" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </symbol>
          </defs>
        </svg>

        <div class="layout-main">
          <div class="layers-column" id="layersColumn">
            <!-- LAYER 3: Config -->
            <div class="layer" data-layer="config" id="layer-config">
              <div class="layer-label">
                <svg viewBox="0 0 20 20"><use href="#icon-config" /></svg>
                用户配置层 <span class="badge">CFG</span>
              </div>
              <div class="layer-modules">
                <div class="module" data-detail="cfg-focus">
                  <svg viewBox="0 0 20 20"><use href="#icon-target" /></svg>
                  关注领域设定
                </div>
                <div class="module" data-detail="cfg-scan">
                  <svg viewBox="0 0 20 20"><use href="#icon-scan" /></svg>
                  扫描频率 <span class="tag tag-scan">实时/每日/每周</span>
                </div>
                <div class="module" data-detail="cfg-filter">
                  <svg viewBox="0 0 20 20"><use href="#icon-doc" /></svg>
                  筛选条件
                </div>
              </div>
            </div>

            <div class="arrow-down" id="arrow1" data-flow="配置指令">
              <svg viewBox="0 0 100 28"><line class="arrow-path" x1="50" y1="0" x2="50" y2="26" stroke="var(--chalk-dimmer)" stroke-width="1.5" marker-end="url(#arrowHead)" opacity=".5"/></svg>
              <div class="arrow-label">配置 · 启动</div>
            </div>

            <!-- LAYER 2: Scan Engine -->
            <div class="layer" data-layer="engine" id="layer-engine">
              <div class="layer-label">
                <svg viewBox="0 0 20 20"><use href="#icon-scan" /></svg>
                扫描引擎层 <span class="badge">SCAN</span>
              </div>
              <div class="layer-modules">
                <div class="module" data-detail="eng-job">
                  <svg viewBox="0 0 20 20"><use href="#icon-coin" /></svg>
                  招聘渠道
                </div>
                <div class="module" data-detail="eng-tech">
                  <svg viewBox="0 0 20 20"><use href="#icon-doc" /></svg>
                  技术社区
                </div>
                <div class="module" data-detail="eng-news">
                  <svg viewBox="0 0 20 20"><use href="#icon-trend" /></svg>
                  行业资讯
                </div>
                <div class="module" data-detail="eng-oss">
                  <svg viewBox="0 0 20 20"><use href="#icon-network" /></svg>
                  开源项目
                </div>
              </div>
            </div>

            <div class="arrow-down" id="arrow2" data-flow="情报流入">
              <svg viewBox="0 0 100 28"><line class="arrow-path" x1="50" y1="0" x2="50" y2="26" stroke="var(--chalk-dimmer)" stroke-width="1.5" marker-end="url(#arrowHead)" opacity=".5"/></svg>
              <div class="arrow-label">新鲜度 × 关联度</div>
            </div>

            <!-- LAYER 1: Output -->
            <div class="layer" data-layer="output" id="layer-output">
              <div class="layer-label">
                <svg viewBox="0 0 20 20"><use href="#icon-dashboard" /></svg>
                情报输出层 <span class="badge">INFO</span>
              </div>
              <div class="layer-modules">
                <div class="module" data-detail="out-dash">
                  <svg viewBox="0 0 20 20"><use href="#icon-dashboard" /></svg>
                  情报看板 <span class="tag tag-out">核心</span>
                </div>
                <div class="module" data-detail="out-alert">
                  <svg viewBox="0 0 20 20"><use href="#icon-trend" /></svg>
                  趋势预警
                </div>
                <div class="module" data-detail="out-list">
                  <svg viewBox="0 0 20 20"><use href="#icon-target" /></svg>
                  机会清单
                </div>
                <div class="module" data-detail="out-map">
                  <svg viewBox="0 0 20 20"><use href="#icon-map" /></svg>
                  市场画像
                </div>
              </div>
            </div>
          </div>

          <div class="side-column" id="sideColumn">
            <div class="side-module" data-detail="side-bookmark">
              <div class="layer-label">
                <svg viewBox="0 0 20 20"><use href="#icon-bookmark" /></svg>
                收藏夹
              </div>
              <div class="desc">分类管理 · 个人注释 · 定期检视</div>
            </div>
            <div class="side-module" data-detail="side-network">
              <div class="layer-label">
                <svg viewBox="0 0 20 20"><use href="#icon-network" /></svg>
                人脉链
              </div>
              <div class="desc">手动记录 · 弱连接提醒 · 不接社交平台</div>
            </div>
          </div>
        </div>

        <!-- USER FLOW -->
        <div class="user-flow" id="userFlow">
          <div class="user-flow-header">
            <svg viewBox="0 0 20 20" style="width:16px;height:16px;flex-shrink:0"><use href="#icon-refresh"/></svg>
            用户流程路径
            <span style="font-size:7px;color:var(--chalk-dim);font-family:var(--font-mono)">[ 动画播放中 ]</span>
          </div>
          <div class="user-flow-steps" id="flowSteps">
            <div class="flow-step" data-step="0">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-config"/></svg></div>
              <span class="label">设定关注</span><div class="conn"></div>
            </div>
            <div class="flow-step" data-step="1">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-scan"/></svg></div>
              <span class="label">自动扫描</span><div class="conn"></div>
            </div>
            <div class="flow-step" data-step="2">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-dashboard"/></svg></div>
              <span class="label">情报更新</span><div class="conn"></div>
            </div>
            <div class="flow-step" data-step="3">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-trend"/></svg></div>
              <span class="label">预警推送</span><div class="conn"></div>
            </div>
            <div class="flow-step" data-step="4">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-target"/></svg></div>
              <span class="label">机会清单</span><div class="conn"></div>
            </div>
            <div class="flow-step" data-step="5">
              <div class="dot"><svg viewBox="0 0 20 20"><use href="#icon-bookmark"/></svg></div>
              <span class="label">收藏/行动</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-card" id="detailCard">
        <button class="close-btn" id="closeDetail">✕ CLOSE</button>
        <div id="detailContent"></div>
      </div>
    </div>

    <script>
      const DETAILS = {
        "cfg-focus": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-target"/></svg> 关注领域设定',
          items: [
            '目标技术栈：Go / Rust / React Native ...',
            '关注行业：FinTech / SaaS / AI / 硬科技',
            '目标公司名单：自定义添加',
            '职位类型：开发 / 架构 / 管理 / 产品',
            '技能关键词：语义匹配，非精确匹配',
          ],
        },
        "cfg-scan": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-scan"/></svg> 扫描频率',
          items: [
            '<span class="hl">实时</span>：仅重大变化推送',
            '<span class="hl">每日（默认）</span>：每日一次汇总',
            '<span class="hl">每周</span>：每周一次汇总',
            '频率设定影响信息新鲜度和通知频率',
          ],
        },
        "cfg-filter": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-doc"/></svg> 筛选条件',
          items: [
            '敏感度等级：高 / 中（默认）/ 低',
            '高敏感度：细微变化就预警，信息量大',
            '中敏感度：变化幅度超过阈值才预警',
            '低敏感度：只推送确认的重大变化',
            '标注"有用"或"噪音"可优化后续筛选',
          ],
        },
        "eng-job": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-coin"/></svg> 人才招聘渠道扫描',
          items: [
            '抓取招聘网站和公司官网的公开职位发布',
            '提取信息：岗位名称 / 技能要求 / 薪资范围 / 地点',
            '仅提取公开信息，不接入封闭招聘 API',
            '数据用于分析需求变化和薪资趋势',
          ],
        },
        "eng-tech": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-doc"/></svg> 技术社区扫描',
          items: [
            '技术文章 / 讨论帖 / 项目动态 / 技术博客',
            '感知什么技术正在被讨论、什么话题升温',
            '关注领域的技术趋势早期信号',
            '语义相似度匹配，非关键词精确匹配',
          ],
        },
        "eng-news": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-trend"/></svg> 行业资讯扫描',
          items: [
            '行业新闻 / 公司动态 / 融资信息 / 政策变化',
            '关注大环境变化对个人职业发展的影响',
            '公司层面：大规模招聘 / 裁员 / 架构调整 / 融资',
            '信息可信度标注：区分事实报道 vs 传言',
          ],
        },
        "eng-oss": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-network"/></svg> 开源项目扫描',
          items: [
            '关注领域开源项目的 <span class="hl">Star 趋势</span>',
            '贡献者活跃度分析',
            '版本发布频率追踪',
            '开源活跃度是技术趋势的 <span class="hl-warn">先行指标</span>',
          ],
        },
        "out-dash": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-dashboard"/></svg> 情报看板',
          items: [
            '<span class="hl">市场温度</span>：岗位数量趋势曲线 + 薪资分布 + 技能热度',
            '<span class="hl">动态流</span>：按时间倒序的信息条目，优先 48h 内',
            '<span class="hl">机会清单</span>：高价值机会自动筛选',
            '三个模块可拖拽调整布局，配置存在本地',
          ],
        },
        "out-alert": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-trend"/></svg> 趋势预警',
          items: [
            '<span class="hl">需求变化</span>：岗位发布量激增或骤降',
            '<span class="hl">薪资波动</span>：薪资区间中位数明显偏移',
            '<span class="hl">新兴技能</span>：JD 中出现新的高频技能关键词',
            '<span class="hl">组织变动</span>：关注公司出现大规模调整',
            '每条预警含：变化描述 / 数据来源 / 可信度 / 原文链接',
          ],
        },
        "out-list": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-target"/></svg> 机会清单',
          items: [
            '从动态流中筛选出的高价值机会',
            '筛选条件：技术栈匹配度 / 薪资范围 / 公司阶段 / 地点',
            '按紧急程度排序',
            '标记操作：已了解 / 已申请 / 不感兴趣',
          ],
        },
        "out-map": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-map"/></svg> 市场画像',
          items: [
            '<span class="hl">技术生态图</span>：技术栈关联关系',
            '<span class="hl">公司地图</span>：公司在技术栈选型上的分布',
            '<span class="hl">薪资热力图</span>：按技术栈 × 城市维度展示',
            '数据完全基于公开信息聚合，不涉及用户数据',
          ],
        },
        "side-bookmark": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-bookmark"/></svg> 收藏夹',
          items: [
            '收藏有价值信息，按自定义分类管理',
            '收藏时添加个人注释：为什么收藏 / 可用于什么场景',
            '收藏不设过期，但可标记"已过期"',
            '系统定期提醒检视，清理过时信息',
          ],
        },
        "side-network": {
          title: '<svg viewBox="0 0 20 20" class="icon" style="width:22px;height:22px"><use href="#icon-network"/></svg> 人脉链',
          items: [
            '纯手动记录，不接入社交平台，不读通讯录',
            '记录：姓名 / 认识场合 / 职位 / 最近联系 / 关系强度',
            '关系强度：弱 / 中 / 强 三级',
            '弱连接超过 6 个月无更新 → 温和提醒',
            '不强提醒、不重复通知、不制造社交压力',
          ],
        },
      };

      document.addEventListener("DOMContentLoaded", () => {
        const layers = document.querySelectorAll(".layer");
        const arrows = document.querySelectorAll(".arrow-down");
        const flowSteps = document.querySelectorAll(".flow-step");
        const sideModules = document.querySelectorAll(".side-module");
        const userFlow = document.querySelector(".user-flow");
        const overlays = document.querySelector("#detailOverlay");
        const detailContent = document.querySelector("#detailContent");
        const closeBtn = document.querySelector("#closeDetail");

        const mainTimeline = anime.timeline({ easing: "easeOutCubic" });
        mainTimeline.add({ targets: "#header", opacity: [0, 1], translateY: [-10, 0], duration: 600 });
        mainTimeline.add({ targets: sideModules, opacity: [0, 1], translateX: [15, 0], duration: 400, delay: anime.stagger(120) }, "-=200");
        mainTimeline.add({ targets: layers, opacity: [0, 1], translateY: [20, 0], duration: 500, delay: anime.stagger(150) }, "-=100");
        mainTimeline.add({ targets: arrows, opacity: [0, 1], duration: 400, delay: anime.stagger(200) }, "-=200");
        setTimeout(() => { document.querySelectorAll(".arrow-path").forEach((p) => { anime({ targets: p, strokeDashoffset: [200, 0], duration: 800, delay: 300, easing: "easeInOutCubic" }); }); }, 1500);
        mainTimeline.add({ targets: userFlow, opacity: [0, 1], duration: 500 }, "-=100");
        mainTimeline.add({ targets: flowSteps, opacity: [0, 1], translateX: [-8, 0], duration: 350, delay: anime.stagger(120) }, "-=200");

        let flowIndex = 0;
        function pulseFlow() { flowSteps.forEach((s) => s.querySelector(".dot").classList.remove("active")); flowSteps[flowIndex].querySelector(".dot").classList.add("active"); flowIndex = (flowIndex + 1) % flowSteps.length; }
        pulseFlow(); setInterval(pulseFlow, 2500);

        layers.forEach((l) => { l.addEventListener("mouseenter", () => { anime({ targets: l, borderColor: "var(--accent-cyan)", backgroundColor: "rgba(34,211,238,0.06)", duration: 200 }); }); l.addEventListener("mouseleave", () => { anime({ targets: l, borderColor: "var(--chalk-dimmer)", backgroundColor: "rgba(224,231,255,0.06)", duration: 300 }); }); });

        function openDetail(id) {
          const data = DETAILS[id]; if (!data) return;
          detailContent.innerHTML = `<h2>${data.title}</h2><ul>${data.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
          overlays.classList.add("open");
          anime({ targets: "#detailCard", scale: [0.85, 1], opacity: [0, 1], duration: 250, easing: "easeOutCubic" });
        }
        function closeDetail() { anime({ targets: "#detailCard", scale: [1, 0.85], opacity: [1, 0], duration: 200, easing: "easeInCubic", complete: () => { overlays.classList.remove("open"); } }); }
        document.querySelectorAll(".module[data-detail]").forEach((el) => { el.addEventListener("click", () => openDetail(el.dataset.detail)); });
        document.querySelectorAll(".side-module[data-detail]").forEach((el) => { el.addEventListener("click", () => openDetail(el.dataset.detail)); });
        closeBtn.addEventListener("click", closeDetail);
        overlays.addEventListener("click", (e) => { if (e.target === overlays) closeDetail(); });

        const board = document.getElementById("chalkboard");
        for (let i = 0; i < 20; i++) {
          const dot = document.createElement("div"); dot.className = "chalk-glow";
          dot.style.left = Math.random() * 100 + "%"; dot.style.top = Math.random() * 100 + "%";
          dot.style.width = dot.style.height = 2 + Math.random() * 4 + "px"; dot.style.opacity = 0.05 + Math.random() * 0.1;
          board.appendChild(dot);
          anime({ targets: dot, translateX: [0, -10 + Math.random() * 20], translateY: [0, -10 + Math.random() * 20], opacity: [0.05, 0.15, 0.05], duration: 3000 + Math.random() * 4000, direction: "alternate", loop: true, easing: "easeInOutSine" });
        }
      });
    </script>
  </body>
</html>
