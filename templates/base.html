<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="pm-base" content="{basePath}" />
    <!-- 同步应用主题：必须早于样式表，否则深色模式首屏会闪白 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pm-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <title>{title} — Product Manuals</title>
    <meta name="description" content="{description}" />
    <!-- Open Graph -->
    <meta property="og:title" content="{ogTitle}" />
    <meta property="og:description" content="{ogDescription}" />
    <meta property="og:type" content="{ogType}" />
    <meta property="og:url" content="{ogUrl}" />
    <meta property="og:image" content="{ogImage}" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="{twitterCard}" />
    <meta name="twitter:title" content="{twitterTitle}" />
    <meta name="twitter:description" content="{twitterDescription}" />
    <!-- Canonical -->
    <link rel="canonical" href="{canonicalUrl}" />
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">{jsonld}</script>
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/ng-nest-moon/product-manuals/main/site/favicon.ico"
    />
    <link rel="stylesheet" href="{basePath}/css/style.css" />
    <!-- 非阻塞加载网络字体：即使 Google Fonts 不可达，系统字体回退栈也能保证中文正确渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css"
      id="hljs-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css"
      id="hljs-dark"
      disabled
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="pm-header">
      <div class="pm-header-inner">
        <a href="{basePath}/" class="pm-logo">
          <span class="pm-logo-icon">PM</span>
          <span class="pm-logo-text">Product Manuals</span>
        </a>
        <nav class="pm-nav">
          <a href="{basePath}/" class="pm-nav-link {homeActive}"><span class="pm-nav-index">01</span>首页</a>
          <a href="{basePath}/#browse" class="pm-nav-link"><span class="pm-nav-index">02</span>产品说明书</a>
          <a
            href="https://github.com/ng-nest-moon/product-manuals"
            class="pm-nav-link"
            target="_blank"><span class="pm-nav-index">03</span>GitHub</a
          >
        </nav>
        <div class="pm-header-actions">
          <button
            class="pm-search-btn"
            id="pm-search-btn"
            type="button"
            title="搜索 (Ctrl+K)"
            aria-label="搜索"
          >
            <svg class="pm-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <circle cx="6.75" cy="6.75" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M9.9 9.9 13.5 13.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <button
            class="pm-theme-toggle"
            id="pm-theme-toggle"
            type="button"
            title="切换主题"
            aria-label="切换主题"
          >
            <svg class="pm-icon pm-icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <path d="M13 9.6A5.3 5.3 0 0 1 6.4 3a5.5 5.5 0 1 0 6.6 6.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            </svg>
            <svg class="pm-icon pm-icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.5" />
              <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M8 1.25v1.6M8 13.15v1.6M1.25 8h1.6M13.15 8h1.6" />
                <path d="M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" />
              </g>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ===== CONTENT ===== -->
    {content}

    <!-- ===== SEARCH OVERLAY ===== -->
    <div class="pm-search-overlay" id="pm-search-overlay">
      <div class="pm-search-modal">
        <div class="pm-search-input-wrap">
          <svg class="pm-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <circle cx="6.75" cy="6.75" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M9.9 9.9 13.5 13.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input
            type="text"
            class="pm-search-input"
            id="pm-search-input"
            placeholder="搜索产品说明书..."
            autocomplete="off"
          />
        </div>
        <div class="pm-search-results" id="pm-search-results">
          <div class="pm-search-empty">输入关键词搜索...</div>
        </div>
        <div class="pm-search-hint">
          使用 <kbd>↑</kbd> <kbd>↓</kbd> 导航 · <kbd>Enter</kbd> 打开 ·
          <kbd>Esc</kbd> 关闭
        </div>
      </div>
    </div>

    <!-- ===== BACK TO TOP ===== -->
    <button
      class="pm-back-to-top"
      id="pm-back-to-top"
      type="button"
      title="返回顶部"
      aria-label="返回顶部"
    >
      <svg class="pm-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M8 13V3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <path d="M3.75 7.5 8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- ===== FOOTER ===== -->
    <footer class="pm-footer">
      <div class="pm-footer-inner">
        <div class="pm-footer-grid">
          <div class="pm-footer-brand">
            <a href="{basePath}/" class="pm-logo">
              <span class="pm-logo-icon">PM</span>
              <span class="pm-logo-text">product-manuals</span>
            </a>
            <p>
              AI
              驱动的产品功能说明书合集——每个文档描述一个产品做什么，而非怎么做。
            </p>
          </div>
          <div class="pm-footer-col">
            <h4>产品</h4>
            <a href="{basePath}/">全部产品</a>
            <a
              href="https://github.com/ng-nest-moon/product-manuals/tree/main/.github/skills/writing-product-specs"
              target="_blank"
              >写作规范</a
            >
          </div>
          <div class="pm-footer-col">
            <h4>链接</h4>
            <a
              href="https://github.com/ng-nest-moon/product-manuals"
              target="_blank"
              >GitHub 仓库</a
            >
            <a href="https://github.com/ng-nest-moon" target="_blank"
              >@ng-nest-moon</a
            >
          </div>
        </div>
        <div class="pm-footer-bottom">
          <span class="pm-footer-copyright"
            >Copyright &copy; 2026 product-manuals</span
          >
          <div class="pm-footer-links">
            <a href="https://github.com/ng-nest-moon/product-manuals">GitHub</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="{basePath}/js/minisearch.js"></script>
    <script src="{basePath}/js/app.js"></script>
    <script src="{basePath}/js/search.js"></script>
    <script>
      hljs.highlightAll();
    </script>
  </body>
</html>
